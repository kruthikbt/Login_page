<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <div class="Profile_icon">
            <i class="fa-solid fa-circle-user" ></i>
        </div>
        <div class="login_card">
            <div class="intro">
                <h1>Hello Again 👋</h1>
                <p>Sign in to continue your account</p>
            </div>
            <br> <br>

            <div class="choose_acc">
                 <span class="google">
                        <button class="border"> <i class="fa-brands fa-google fa-float" ></i>Continue with Google </button>
                 </span>
           
                <span class="github">
                        <button class="border"> <i class="fa-brands fa-github fa-float" 30,></i>Continue with Github</button>
                 </span>
            </div>
        <pre id="or"> ___________________ or __________________</pre>


            <div class="mail_select_tag ">
                <h2>Username</h2>
                <input type="text"  class="margin" placeholder="ex:kruthik@1456">
                <br><br>
            </div>

            <div class="Password_select_tag">
               <h2>Password</h2>
                <input type="password" class="margin" placeholder="password">
            </div>
            <br>
            <div class="remember_me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember"></label>
                <h3>Remember me</h3>
            </div>

            <div class="signin">
                <button> Sign in</button>
            </div>

            <div class="forgot">
                <p><u>Forgot Password?</u></p>
            </div>

         
            
        </div>
    </div>
</body>
</html>
